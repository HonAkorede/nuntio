# Runs on every push and pull request. A red result means something below failed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Check for committed secrets
        run: npm run check-secrets

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the site
        run: npm run build

      - name: Confirm dist matches the source
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist is out of date. Run npm run build and commit the result."
            git status --short dist
            exit 1
          fi

      - name: Server starts and answers health checks
        run: |
          PORT=3100 NODE_ENV=production node server/index.js &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3100/api/health; then break; fi
            sleep 0.5
          done
          curl -fsS http://localhost:3100/api/health | grep '"status":"ok"'
          curl -fsS http://localhost:3100/ | grep -q '<title>'
